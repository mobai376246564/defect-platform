# 网页容器的 Nginx 配置：静态页面 + 反代 /api 到服务端。
# 与单机部署（deploy/pm2/ecosystem.config.cjs 生成的配置）保持同样的缓存、上传与超时设置。

# CLB 终止 HTTPS 后转发 http，协议沿用 CLB 传来的 X-Forwarded-Proto；直连时取本跳协议
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # APP 提单一次请求带全部附件（单个文件 200 MB、合计 500 MB），网页提单在本地存储模式下也经由服务端上传
  client_max_body_size 512m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 安全响应头
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://__API_UPSTREAM__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 追加上一跳（CLB）地址；服务端按 TRUST_PROXY_HOPS 取真实客户端 IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # 大文件上传直接流给服务端，不先落到 nginx 临时目录；慢网上传 200 MB 也不超时
    proxy_request_buffering off;
    # MCP 返回大段文本 / 图片时不要缓冲截断
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # 带指纹的静态资源长期缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # 构建产物里的 sourcemap 只用于排查，不对外提供
  location ~ \.map$ {
    return 404;
  }

  # 单页应用：其余路径回落到 index.html，且不缓存，发版后刷新即生效
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
