# 单台 CVM 部署（MVP，方案 8.1）。数据库使用 TencentDB for PostgreSQL，不在本机运行。
# 用法（在仓库根目录）：
#   cp deploy/.env.production.example deploy/.env.production   # 填写真实配置
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# 镜像也可改为从腾讯云 TCR 拉取：把 build 段替换为 image: ccr.ccs.tencentyun.com/<命名空间>/defect-server:<版本>

name: defect-platform

services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: migrator
    env_file: .env.production
    restart: 'no'

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: runtime
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # MCP 端点需要从开发者电脑访问，统一经 web(Nginx) 的 /api 暴露，不直接开放 3000
    expose:
      - '3000'
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - server
    restart: unless-stopped
    # 由腾讯云 CLB 终止 HTTPS 后转发到本机 80 端口
    ports:
      - '80:80'
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }
