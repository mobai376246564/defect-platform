# 单台 CVM 部署（MVP，方案 8.1）。数据库使用 TencentDB for PostgreSQL，不在本机运行。
# 日常更新由 .github/workflows/deploy.yml 自动执行（推送到 main 即部署，镜像按提交号打标签）。
# 手动部署（在仓库根目录）：
#   cp deploy/.env.production.example deploy/.env.production   # 填写真实配置
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# 镜像改为从腾讯云 TCR 拉取时：在 .env.production 里设置 IMAGE_REGISTRY 与 IMAGE_TAG，
# 然后 docker compose ... pull && docker compose ... up -d（不加 --build），详见 docs/deploy-tencent-cloud.md。

name: defect-platform

x-build-args: &build-args
  NPM_REGISTRY: ${NPM_REGISTRY:-}
  DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
  FFMPEG_BINARIES_URL: ${FFMPEG_BINARIES_URL:-}

x-logging: &logging
  driver: json-file
  options: { max-size: '50m', max-file: '5' }

services:
  migrate:
    image: ${IMAGE_REGISTRY:-defect}/defect-migrator:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: migrator
      args: *build-args
    env_file: .env.production
    restart: 'no'
    logging: *logging

  server:
    image: ${IMAGE_REGISTRY:-defect}/defect-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: runtime
      args: *build-args
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # 本地存储模式（STORAGE_DRIVER=local）的附件存这里；用 COS 时这个卷是空的
    volumes:
      - server-data:/data
    # MCP 端点需要从开发者电脑访问，统一经 web(Nginx) 的 /api 暴露，不直接开放 3000
    expose:
      - '3000'
    stop_grace_period: 15s
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:-defect}/defect-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    depends_on:
      - server
    restart: unless-stopped
    # 由腾讯云 CLB 终止 HTTPS 后转发到本机 WEB_PORT（默认 80）
    ports:
      - '${WEB_PORT:-80}:80'
    logging: *logging

volumes:
  server-data:
